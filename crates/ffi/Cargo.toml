[package]
name = "beacon-ffi"
description = "UniFFI bridge exposing the Family Beacon sync core to the iOS and Android apps."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "beacon_ffi"
# staticlib: linked into the iOS XCFramework. cdylib: loaded on Android and
# read by uniffi-bindgen to generate bindings. lib: Rust tests.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
base64.workspace = true
beacon-sync-core = { path = "../sync-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uniffi.workspace = true
zeroize.workspace = true

[lints]
workspace = true
