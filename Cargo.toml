[workspace]
resolver = "2"
members = ["crates/crypto", "crates/ffi", "crates/protocol", "crates/sync-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[workspace.dependencies]
beacon-crypto = { path = "crates/crypto" }
beacon-protocol = { path = "crates/protocol" }
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
hmac = "0.12"
log = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
# Bundled: phones get one known SQLite build instead of the OS copy.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
# Pinned to the series uniffi-bindgen-react-native supports (its 0.31.0-x releases).
uniffi = "0.31"
uuid = { version = "1", features = ["v4", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
